name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-v094-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.FAYROZ_KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare approved launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          cat app/icon/ic_launcher_art.b64.0 app/icon/ic_launcher_art.b64.1 | base64 --decode > app/src/main/res/drawable-nodpi/ic_launcher_art.webp
          test -s app/src/main/res/drawable-nodpi/ic_launcher_art.webp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FayrozRequests-v0.9.4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: FayrozRequests-v0.9.4-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Collect Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p "$RUNNER_TEMP/android-signing-tools"
          cp "$TOOLS_DIR/zipalign" "$RUNNER_TEMP/android-signing-tools/"
          cp "$TOOLS_DIR/apksigner" "$RUNNER_TEMP/android-signing-tools/"
          cp "$TOOLS_DIR/lib/apksigner.jar" "$RUNNER_TEMP/android-signing-tools/"
          chmod +x "$RUNNER_TEMP/android-signing-tools/zipalign" "$RUNNER_TEMP/android-signing-tools/apksigner"

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: ${{ runner.temp }}/android-signing-tools
          if-no-files-found: error
          retention-days: 7

      - name: Decode release keystore
        if: ${{ env.RELEASE_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fayroz-release.jks"
          test -s "$RUNNER_TEMP/fayroz-release.jks"

      - name: Build signed release APK
        if: ${{ env.RELEASE_KEYSTORE_B64 != '' }}
        env:
          FAYROZ_KEYSTORE_PATH: ${{ runner.temp }}/fayroz-release.jks
          FAYROZ_STORE_PASSWORD: ${{ secrets.FAYROZ_STORE_PASSWORD }}
          FAYROZ_KEY_ALIAS: ${{ secrets.FAYROZ_KEY_ALIAS }}
          FAYROZ_KEY_PASSWORD: ${{ secrets.FAYROZ_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload signed release APK
        if: ${{ env.RELEASE_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FayrozRequests-v0.9.4-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  signing-tools-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect official Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p "$RUNNER_TEMP/android-signing-tools"
          cp "$TOOLS_DIR/zipalign" "$RUNNER_TEMP/android-signing-tools/"
          cp "$TOOLS_DIR/apksigner" "$RUNNER_TEMP/android-signing-tools/"
          cp "$TOOLS_DIR/lib/apksigner.jar" "$RUNNER_TEMP/android-signing-tools/"
          chmod +x "$RUNNER_TEMP/android-signing-tools/zipalign" "$RUNNER_TEMP/android-signing-tools/apksigner"
      - name: Upload official Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-fast
          path: ${{ runner.temp }}/android-signing-tools
          if-no-files-found: error
          retention-days: 7
